<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Shredder — Tie-Dye Pixel Art Generation</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --card-border: #23314d;
      --input-bg: #0b1120;
      --input-border: #334155;
      --input-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --accent-orange: #fb923c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .main-layout {
      display: flex;
      gap: 24px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Viewport Card */
    .viewport-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 548px;
    }

    .canvas-container {
      width: 512px;
      height: 512px;
      background: #020617;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Stats Grid */
    .stats-bar {
      width: 100%;
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-tile {
      background: var(--bg-dark);
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .val-blue { color: var(--accent-cyan); }
    .val-purple { color: var(--accent-purple); }
    .val-green { color: var(--accent-green); }
    .val-orange { color: var(--accent-orange); }

    /* Controls Panel Card */
    .controls-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.75px;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .hint {
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 400;
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus, input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    input[type="number"] {
      font-variant-numeric: tabular-nums;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input[type="checkbox"] {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #020617;
    }
    .btn-primary:hover {
      background: #7dd3fc;
    }

    .btn-secondary {
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: #1e293b;
      border-color: #475569;
    }

    .btn-export {
      background: #243049;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-export:hover {
      background: #334155;
    }

    .warning-box {
      font-size: 0.72rem;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 6px 8px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Color Shredder</h1>
    <p>Tie-Dye Pixel Art Generation — High-Precision Parallel In-Browser Processing</p>
  </header>

  <div class="main-layout">
    <!-- Canvas Viewport -->
    <div class="viewport-card">
      <div class="canvas-container">
        <canvas id="canvas" width="64" height="64"></canvas>
      </div>

      <div class="stats-bar">
        <div class="stat-tile">
          <div class="stat-label">Placed</div>
          <div class="stat-value val-blue" id="stat-placed">0 / 4,096</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Frontier</div>
          <div class="stat-value val-purple" id="stat-frontier">0</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Progress</div>
          <div class="stat-value val-green" id="stat-pct">0.0%</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Rate</div>
          <div class="stat-value val-orange" id="stat-rate">0 px/s</div>
        </div>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-card">
      <div class="card-title">
        <span>Parameters & Config</span>
        <span class="info-tag" id="palette-size-badge">262,144 colors</span>
      </div>

      <!-- Geometry -->
      <div class="section-label">Canvas Geometry & Seed</div>
      <div class="form-grid-2">
        <div class="control-group">
          <label for="inp-width">Width <span class="hint">[px]</span></label>
          <input type="number" id="inp-width" value="64" min="2" max="2048" step="1">
        </div>
        <div class="control-group">
          <label for="inp-height">Height <span class="hint">[px]</span></label>
          <input type="number" id="inp-height" value="64" min="2" max="2048" step="1">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="control-group">
          <label for="inp-start-x">Start X <span class="hint">[coord]</span></label>
          <input type="number" id="inp-start-x" value="32" min="0" max="2047" step="1">
        </div>
        <div class="control-group">
          <label for="inp-start-y">Start Y <span class="hint">[coord]</span></label>
          <input type="number" id="inp-start-y" value="32" min="0" max="2047" step="1">
        </div>
      </div>

      <!-- Strategy & Color Model -->
      <div class="section-label">Algorithmic Strategy & Color Model</div>
      <div class="control-group">
        <label for="sel-strategy">Placement Strategy</label>
        <select id="sel-strategy">
          <option value="3" selected>3: Neighborhood Color Average (Organic / Ties)</option>
          <option value="2">2: Average Distance to Neighbors (Smooth / Sharp)</option>
          <option value="1">1: Min Neighbor Distance (Gritty / Pixelated)</option>
        </select>
      </div>

      <div class="form-grid-2">
        <div class="control-group">
          <label for="sel-color-space">Color Space</label>
          <select id="sel-color-space">
            <option value="rgb" selected>RGB</option>
            <option value="hsv">HSV (Hue, Sat, Val)</option>
            <option value="hls">HLS (Hue, Light, Sat)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="inp-bit-depth">Bit Depth <span class="hint">[1 - 8]</span></label>
          <input type="number" id="inp-bit-depth" value="6" min="1" max="8" step="1">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="control-group">
          <label for="sel-fixed-channel">Fixed Channel (-x)</label>
          <select id="sel-fixed-channel">
            <option value="none" selected>None (All Shuffled)</option>
            <option value="0">Channel 1 (R / H / H)</option>
            <option value="1">Channel 2 (G / S / L)</option>
            <option value="2">Channel 3 (B / V / S)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="inp-seed">PRNG Seed <span class="hint">[Optional]</span></label>
          <input type="number" id="inp-seed" placeholder="Random" min="0" max="4294967295" step="1">
        </div>
      </div>

      <!-- Execution / Step Tuning & Multiprocessing -->
      <div class="section-label">Multiprocessing & Execution Tuning</div>
      <div class="form-grid-2">
        <div class="control-group">
          <label for="inp-threads">CPU Threads <span class="hint" id="cores-hint"></span></label>
          <input type="number" id="inp-threads" value="4" min="1" max="128" step="1">
        </div>
        <div class="control-group">
          <label for="inp-batch-size">Batch Speed <span class="hint">[px/frame]</span></label>
          <input type="number" id="inp-batch-size" value="500" min="1" max="50000" step="1">
        </div>
      </div>

      <div class="control-group" style="padding-bottom: 2px;">
        <label class="checkbox-row">
          <input type="checkbox" id="chk-uncapped" checked>
          <span>Uncapped Maximum Speed (Saturates all CPU cores)</span>
        </label>
      </div>

      <div class="control-group" style="padding-bottom: 2px;">
        <label class="checkbox-row">
          <input type="checkbox" id="chk-shuffle" checked>
          <span>Final Global Palette Shuffle</span>
        </label>
      </div>

      <div id="warn-box" class="warning-box"></div>

      <!-- Actions -->
      <div class="btn-row">
        <button id="btn-toggle" class="btn-primary">Start</button>
        <button id="btn-reset" class="btn-secondary">Reset / Apply</button>
      </div>

      <button id="btn-download" class="btn-export">Export Canvas PNG</button>
    </div>
  </div>

  <script>
    // --- HIGH QUALITY DETERMINISTIC PRNG (SFC32) ---
    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
        let t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      };
    }

    function createRng(seed) {
      if (seed === null || seed === undefined || isNaN(seed)) {
        return Math.random;
      }
      let s = seed >>> 0;
      return sfc32(0x9E3779B9, 0x243F6A88, 0xB7E15162, s);
    }

    // --- COLOR SPACE PIPELINE ---
    function hsvToRgb(h, s, v) {
      let r, g, b;
      let i = Math.floor(h * 6);
      let f = h * 6 - i;
      let p = v * (1 - s);
      let q = v * (1 - f * s);
      let t = v * (1 - (1 - f) * s);
      switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
      }
      return [r, g, b];
    }

    function hlsToRgb(h, l, s) {
      if (s === 0) return [l, l, l];
      let m2 = l <= 0.5 ? l * (1 + s) : l + s - l * s;
      let m1 = 2 * l - m2;
      function hueToRgb(m1, m2, h) {
        if (h < 0) h += 1;
        if (h > 1) h -= 1;
        if (h < 1/6) return m1 + (m2 - m1) * h * 6;
        if (h < 1/2) return m2;
        if (h < 2/3) return m1 + (m2 - m1) * (2/3 - h) * 6;
        return m1;
      }
      return [hueToRgb(m1, m2, h + 1/3), hueToRgb(m1, m2, h), hueToRgb(m1, m2, h - 1/3)];
    }

    function generateColors(bitDepth, space, fixedChannel, doShuffle, seed) {
      const rng = createRng(seed);
      const valuesPerChannel = 1 << bitDepth;
      const numSubColors = valuesPerChannel * valuesPerChannel;
      const total = valuesPerChannel * numSubColors;
      const colors = new Float32Array(total * 3);
      let idx = 0;

      const hues = Array.from({ length: valuesPerChannel }, (_, i) => i);
      for (let i = hues.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [hues[i], hues[j]] = [hues[j], hues[i]];
      }

      const channelShift = fixedChannel !== null ? fixedChannel : 0;

      for (let chan1 of hues) {
        const sliceColors = [];
        for (let chan2 = 0; chan2 < valuesPerChannel; chan2++) {
          for (let chan3 = 0; chan3 < valuesPerChannel; chan3++) {
            const raw = [0, 0, 0];
            raw[(0 + channelShift) % 3] = chan1 / valuesPerChannel;
            raw[(1 + channelShift) % 3] = chan2 / valuesPerChannel;
            raw[(2 + channelShift) % 3] = chan3 / valuesPerChannel;

            let r = raw[0], g = raw[1], b = raw[2];
            if (space === 'hsv') [r, g, b] = hsvToRgb(r, g, b);
            else if (space === 'hls') [r, g, b] = hlsToRgb(r, g, b);

            sliceColors.push(r, g, b);
          }
        }

        for (let i = (sliceColors.length / 3) - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          for (let c = 0; c < 3; c++) {
            const tmp = sliceColors[i * 3 + c];
            sliceColors[i * 3 + c] = sliceColors[j * 3 + c];
            sliceColors[j * 3 + c] = tmp;
          }
        }

        for (let i = 0; i < sliceColors.length; i++) {
          colors[idx++] = sliceColors[i];
        }
      }

      if (doShuffle) {
        for (let i = total - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          for (let c = 0; c < 3; c++) {
            const tmp = colors[i * 3 + c];
            colors[i * 3 + c] = colors[j * 3 + c];
            colors[j * 3 + c] = tmp;
          }
        }
      }

      return colors;
    }

    // --- COMPUTE SEARCH WORKER SCRIPT ---
    const computeWorkerSource = `
      self.onmessage = function(e) {
        const d = e.data;
        const control = new Int32Array(d.controlSab);
        const targetColor = new Float32Array(d.targetColorSab);
        const resultsDist = new Float32Array(d.resultsDistSab);
        const resultsIdx = new Int32Array(d.resultsIdxSab);
        const grid = new Int32Array(d.gridSab);
        const placedR = new Float32Array(d.placedRSab);
        const placedG = new Float32Array(d.placedGSab);
        const placedB = new Float32Array(d.placedBSab);
        const frontier = new Int32Array(d.frontierSab);
        const avgR = new Float32Array(d.avgRSab);
        const avgG = new Float32Array(d.avgGSab);
        const avgB = new Float32Array(d.avgBSab);

        const id = d.id;
        const numWorkers = d.numWorkers;
        const width = d.width;
        const height = d.height;
        const strategy = d.strategy;

        let lastSeq = 0;
        while (true) {
          while (Atomics.load(control, 0) === lastSeq) {
            Atomics.wait(control, 0, lastSeq);
          }
          if (Atomics.load(control, 3) === 1) break; // exit flag
          lastSeq = Atomics.load(control, 0);

          const flen = Atomics.load(control, 1);
          const tr = targetColor[0];
          const tg = targetColor[1];
          const tb = targetColor[2];

          const start = Math.floor((id * flen) / numWorkers);
          const end = Math.floor(((id + 1) * flen) / numWorkers);

          let bestDist = Infinity;
          let bestCand = -1;

          if (strategy === 3) {
            for (let j = start; j < end; j++) {
              const cand = frontier[j];
              const dr = tr - avgR[cand];
              const dg = tg - avgG[cand];
              const db = tb - avgB[cand];
              const dist = dr * dr + dg * dg + db * db;
              if (dist < bestDist) {
                bestDist = dist;
                bestCand = cand;
              }
            }
          } else if (strategy === 2) {
            for (let j = start; j < end; j++) {
              const cand = frontier[j];
              const cx = cand % width;
              const cy = (cand / width) | 0;
              let sumD = 0, count = 0;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx === 0 && dy === 0) continue;
                  const nx = cx + dx, ny = cy + dy;
                  if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                    const n = ny * width + nx;
                    if (grid[n] !== -1) {
                      count++;
                      const dr = tr - placedR[n];
                      const dg = tg - placedG[n];
                      const db = tb - placedB[n];
                      sumD += dr * dr + dg * dg + db * db;
                    }
                  }
                }
              }
              const avgD = count > 0 ? sumD / count : Infinity;
              if (avgD < bestDist) {
                bestDist = avgD;
                bestCand = cand;
              }
            }
          } else {
            for (let j = start; j < end; j++) {
              const cand = frontier[j];
              const cx = cand % width;
              const cy = (cand / width) | 0;
              let minD = Infinity;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx === 0 && dy === 0) continue;
                  const nx = cx + dx, ny = cy + dy;
                  if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                    const n = ny * width + nx;
                    if (grid[n] !== -1) {
                      const dr = tr - placedR[n];
                      const dg = tg - placedG[n];
                      const db = tb - placedB[n];
                      const d = dr * dr + dg * dg + db * db;
                      if (d < minD) minD = d;
                    }
                  }
                }
              }
              if (minD < bestDist) {
                bestDist = minD;
                bestCand = cand;
              }
            }
          }

          resultsDist[id] = bestDist;
          resultsIdx[id] = bestCand;

          const done = Atomics.add(control, 2, 1) + 1;
          if (done === numWorkers) {
            Atomics.notify(control, 2, 1);
          }
        }
      };
    `;

    // --- COORDINATOR SIMULATION WORKER SCRIPT ---
    const coordinatorWorkerSource = `
      let isRunning = false;
      let isFinished = false;
      let width, height, totalPixels, strategy, numWorkers;
      let control, targetColor, resultsDist, resultsIdx;
      let grid, placedR, placedG, placedB, frontier, avgR, avgG, avgB;
      let sharedRgba, colors;
      let uncapped = true, batchSpeed = 500;

      let frontierPos;
      let frontierLen = 0;
      let placedCount = 0;
      let colorIdx = 0;
      let taskSeq = 0;
      let lastTickTime = 0;
      let lastPlacedTick = 0;

      function getNeighbors(idx) {
        const x = idx % width;
        const y = (idx / width) | 0;
        const nbrs = [];
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
              nbrs.push(ny * width + nx);
            }
          }
        }
        return nbrs;
      }

      function updateAverage(idx) {
        let count = 0, sr = 0, sg = 0, sb = 0;
        const cx = idx % width, cy = (idx / width) | 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = cx + dx, ny = cy + dy;
            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
              const n = ny * width + nx;
              if (grid[n] !== -1) {
                count++;
                sr += placedR[n];
                sg += placedG[n];
                sb += placedB[n];
              }
            }
          }
        }
        if (count > 0) {
          avgR[idx] = sr / count;
          avgG[idx] = sg / count;
          avgB[idx] = sb / count;
        }
      }

      function paint(idx, r, g, b) {
        grid[idx] = placedCount;
        placedR[idx] = r;
        placedG[idx] = g;
        placedB[idx] = b;
        placedCount++;

        const pIdx = idx * 4;
        sharedRgba[pIdx] = Math.round(r * 255);
        sharedRgba[pIdx + 1] = Math.round(g * 255);
        sharedRgba[pIdx + 2] = Math.round(b * 255);
        sharedRgba[pIdx + 3] = 255;

        const pos = frontierPos[idx];
        if (pos !== -1) {
          const lastCand = frontier[frontierLen - 1];
          frontier[pos] = lastCand;
          frontierPos[lastCand] = pos;
          frontierPos[idx] = -1;
          frontierLen--;
        }

        const nbrs = getNeighbors(idx);
        for (let n of nbrs) {
          if (grid[n] === -1) {
            if (frontierPos[n] === -1) {
              frontier[frontierLen] = n;
              frontierPos[n] = frontierLen;
              frontierLen++;
            }
            if (strategy === 3) {
              updateAverage(n);
            }
          }
        }
      }

      function searchParallel(tr, tg, tb) {
        targetColor[0] = tr;
        targetColor[1] = tg;
        targetColor[2] = tb;
        Atomics.store(control, 1, frontierLen);
        Atomics.store(control, 2, 0); // reset done count

        taskSeq++;
        Atomics.store(control, 0, taskSeq);
        Atomics.notify(control, 0, numWorkers);

        while (true) {
          const done = Atomics.load(control, 2);
          if (done >= numWorkers) break;
          Atomics.wait(control, 2, done);
        }

        let bestDist = resultsDist[0];
        let bestCand = resultsIdx[0];
        for (let i = 1; i < numWorkers; i++) {
          if (resultsDist[i] < bestDist) {
            bestDist = resultsDist[i];
            bestCand = resultsIdx[i];
          }
        }
        return bestCand;
      }

      function searchSingle(tr, tg, tb) {
        let bestDist = Infinity;
        let bestCand = frontier[0];

        if (strategy === 3) {
          for (let j = 0; j < frontierLen; j++) {
            const cand = frontier[j];
            const dr = tr - avgR[cand], dg = tg - avgG[cand], db = tb - avgB[cand];
            const d = dr * dr + dg * dg + db * db;
            if (d < bestDist) {
              bestDist = d;
              bestCand = cand;
            }
          }
        } else if (strategy === 2) {
          for (let j = 0; j < frontierLen; j++) {
            const cand = frontier[j];
            const cx = cand % width, cy = (cand / width) | 0;
            let sumD = 0, count = 0;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = cx + dx, ny = cy + dy;
                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                  const n = ny * width + nx;
                  if (grid[n] !== -1) {
                    count++;
                    const dr = tr - placedR[n], dg = tg - placedG[n], db = tb - placedB[n];
                    sumD += dr * dr + dg * dg + db * db;
                  }
                }
              }
            }
            const avgD = count > 0 ? sumD / count : Infinity;
            if (avgD < bestDist) {
              bestDist = avgD;
              bestCand = cand;
            }
          }
        } else {
          for (let j = 0; j < frontierLen; j++) {
            const cand = frontier[j];
            const cx = cand % width, cy = (cand / width) | 0;
            let minD = Infinity;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = cx + dx, ny = cy + dy;
                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                  const n = ny * width + nx;
                  if (grid[n] !== -1) {
                    const dr = tr - placedR[n], dg = tg - placedG[n], db = tb - placedB[n];
                    const d = dr * dr + dg * dg + db * db;
                    if (d < minD) minD = d;
                  }
                }
              }
            }
            if (minD < bestDist) {
              bestDist = minD;
              bestCand = cand;
            }
          }
        }
        return bestCand;
      }

      function runLoop() {
        if (!isRunning || isFinished) return;

        const totalColors = colors.length / 3;
        let stepsThisBatch = 0;

        while (isRunning && !isFinished) {
          if (placedCount >= totalPixels || frontierLen === 0) {
            isFinished = true;
            isRunning = false;
            self.postMessage({
              cmd: 'tick',
              placedCount,
              frontierLen,
              finished: true
            });
            return;
          }

          const cPos = (colorIdx % totalColors) * 3;
          const tr = colors[cPos];
          const tg = colors[cPos + 1];
          const tb = colors[cPos + 2];
          colorIdx++;

          let bestCand;
          if (numWorkers > 1 && frontierLen >= 64) {
            bestCand = searchParallel(tr, tg, tb);
          } else {
            bestCand = searchSingle(tr, tg, tb);
          }

          paint(bestCand, tr, tg, tb);
          stepsThisBatch++;

          const now = performance.now();
          if (uncapped) {
            // In uncapped mode: burn CPU continuously, yielding to event queue every 16ms for 60fps updates and pause responsiveness
            if (now - lastTickTime >= 16) {
              self.postMessage({
                cmd: 'tick',
                placedCount,
                frontierLen,
                finished: false
              });
              lastTickTime = now;
              setTimeout(runLoop, 0);
              return;
            }
          } else {
            // In paced mode: execute requested batchSpeed pixels per animation frame
            if (stepsThisBatch >= batchSpeed) {
              self.postMessage({
                cmd: 'tick',
                placedCount,
                frontierLen,
                finished: false
              });
              lastTickTime = now;
              setTimeout(runLoop, 16);
              return;
            }
          }
        }
      }

      self.onmessage = function(e) {
        const msg = e.data;
        if (msg.cmd === 'init') {
          width = msg.width;
          height = msg.height;
          totalPixels = width * height;
          strategy = msg.strategy;
          numWorkers = msg.numWorkers;
          uncapped = msg.uncapped;
          batchSpeed = msg.batchSpeed;

          control = new Int32Array(msg.controlSab);
          targetColor = new Float32Array(msg.targetColorSab);
          resultsDist = new Float32Array(msg.resultsDistSab);
          resultsIdx = new Int32Array(msg.resultsIdxSab);
          grid = new Int32Array(msg.gridSab);
          placedR = new Float32Array(msg.placedRSab);
          placedG = new Float32Array(msg.placedGSab);
          placedB = new Float32Array(msg.placedBSab);
          frontier = new Int32Array(msg.frontierSab);
          avgR = new Float32Array(msg.avgRSab);
          avgG = new Float32Array(msg.avgGSab);
          avgB = new Float32Array(msg.avgBSab);
          sharedRgba = new Uint8ClampedArray(msg.sharedRgbaSab);
          colors = new Float32Array(msg.colorsSab);

          frontierPos = new Int32Array(totalPixels).fill(-1);
          frontierLen = 0;
          placedCount = 0;
          colorIdx = 0;
          taskSeq = 0;
          isFinished = false;
          isRunning = false;

          // Paint seed pixel
          const sx = Math.min(Math.max(0, msg.startX), width - 1);
          const sy = Math.min(Math.max(0, msg.startY), height - 1);
          const startIdx = sy * width + sx;
          const r = colors[0], g = colors[1], b = colors[2];
          colorIdx = 1;
          paint(startIdx, r, g, b);

          lastTickTime = performance.now();
          lastPlacedTick = placedCount;

          self.postMessage({
            cmd: 'tick',
            placedCount,
            frontierLen,
            finished: false
          });
        } else if (msg.cmd === 'start') {
          if (!isRunning && !isFinished) {
            isRunning = true;
            runLoop();
          }
        } else if (msg.cmd === 'pause') {
          isRunning = false;
        } else if (msg.cmd === 'setTuning') {
          uncapped = msg.uncapped;
          batchSpeed = msg.batchSpeed;
        }
      };
    `;

    // --- MAIN THREAD COORDINATION ---
    let coordinatorWorker = null;
    let computeWorkers = [];
    let computeBlobUrl = null;
    let coordinatorBlobUrl = null;
    let sharedRgbaSab = null;
    let sharedRgbaView = null;
    let localImageData = null;
    let totalCanvasPixels = 4096;

    let isRunning = false;
    let lastStatsTime = 0;
    let lastPlacedStats = 0;

    const inpWidth = document.getElementById('inp-width');
    const inpHeight = document.getElementById('inp-height');
    const inpStartX = document.getElementById('inp-start-x');
    const inpStartY = document.getElementById('inp-start-y');
    const selStrategy = document.getElementById('sel-strategy');
    const selColorSpace = document.getElementById('sel-color-space');
    const inpBitDepth = document.getElementById('inp-bit-depth');
    const selFixedChannel = document.getElementById('sel-fixed-channel');
    const inpSeed = document.getElementById('inp-seed');
    const inpThreads = document.getElementById('inp-threads');
    const inpBatchSize = document.getElementById('inp-batch-size');
    const chkUncapped = document.getElementById('chk-uncapped');
    const chkShuffle = document.getElementById('chk-shuffle');
    const coresHint = document.getElementById('cores-hint');

    const elPlaced = document.getElementById('stat-placed');
    const elFrontier = document.getElementById('stat-frontier');
    const elPct = document.getElementById('stat-pct');
    const elRate = document.getElementById('stat-rate');
    const btnToggle = document.getElementById('btn-toggle');
    const btnReset = document.getElementById('btn-reset');
    const btnDownload = document.getElementById('btn-download');
    const elBadge = document.getElementById('palette-size-badge');
    const elWarn = document.getElementById('warn-box');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const maxCores = navigator.hardwareConcurrency || 4;
    inpThreads.value = maxCores;
    coresHint.textContent = `[${maxCores} cores detected]`;

    function updateBadge() {
      const depth = parseInt(inpBitDepth.value) || 6;
      const count = Math.pow(2, depth * 3);
      elBadge.textContent = `${count.toLocaleString()} colors (${depth}-bit)`;
    }

    inpWidth.addEventListener('input', () => {
      const w = parseInt(inpWidth.value) || 64;
      inpStartX.max = Math.max(0, w - 1);
      if (document.activeElement !== inpStartX) {
        inpStartX.value = Math.floor(w / 2);
      }
    });

    inpHeight.addEventListener('input', () => {
      const h = parseInt(inpHeight.value) || 64;
      inpStartY.max = Math.max(0, h - 1);
      if (document.activeElement !== inpStartY) {
        inpStartY.value = Math.floor(h / 2);
      }
    });

    inpBitDepth.addEventListener('input', updateBadge);

    chkUncapped.addEventListener('change', () => {
      if (coordinatorWorker) {
        coordinatorWorker.postMessage({
          cmd: 'setTuning',
          uncapped: chkUncapped.checked,
          batchSpeed: Math.max(1, parseInt(inpBatchSize.value) || 500)
        });
      }
    });

    inpBatchSize.addEventListener('input', () => {
      if (coordinatorWorker) {
        coordinatorWorker.postMessage({
          cmd: 'setTuning',
          uncapped: chkUncapped.checked,
          batchSpeed: Math.max(1, parseInt(inpBatchSize.value) || 500)
        });
      }
    });

    function terminateAllWorkers() {
      if (coordinatorWorker) {
        coordinatorWorker.terminate();
        coordinatorWorker = null;
      }
      for (let w of computeWorkers) {
        w.terminate();
      }
      computeWorkers = [];
      if (computeBlobUrl) URL.revokeObjectURL(computeBlobUrl);
      if (coordinatorBlobUrl) URL.revokeObjectURL(coordinatorBlobUrl);
      computeBlobUrl = null;
      coordinatorBlobUrl = null;
    }

    function reset() {
      isRunning = false;
      btnToggle.textContent = 'Start';
      terminateAllWorkers();

      const width = Math.max(2, Math.min(2048, parseInt(inpWidth.value) || 64));
      const height = Math.max(2, Math.min(2048, parseInt(inpHeight.value) || 64));
      const startX = parseInt(inpStartX.value) || Math.floor(width / 2);
      const startY = parseInt(inpStartY.value) || Math.floor(height / 2);
      const strategy = parseInt(selStrategy.value) || 3;
      const bitDepth = Math.max(1, Math.min(8, parseInt(inpBitDepth.value) || 6));
      const space = selColorSpace.value;
      const fixed = selFixedChannel.value === 'none' ? null : parseInt(selFixedChannel.value);
      const shuffle = chkShuffle.checked;
      const seedVal = inpSeed.value.trim() !== '' ? parseInt(inpSeed.value) : null;
      const threadCount = Math.max(1, Math.min(128, parseInt(inpThreads.value) || 4));
      const uncapped = chkUncapped.checked;
      const batchSpeed = Math.max(1, parseInt(inpBatchSize.value) || 500);

      totalCanvasPixels = width * height;
      const totalPalette = Math.pow(2, bitDepth * 3);

      if (totalCanvasPixels > totalPalette) {
        elWarn.style.display = 'block';
        elWarn.textContent = `Warning: Canvas (${totalCanvasPixels.toLocaleString()} px) exceeds unique palette (${totalPalette.toLocaleString()} colors). Colors will repeat cyclically.`;
      } else {
        elWarn.style.display = 'none';
      }

      updateBadge();

      canvas.width = width;
      canvas.height = height;
      localImageData = ctx.createImageData(width, height);

      const hasSAB = (typeof SharedArrayBuffer !== 'undefined');
      if (!hasSAB) {
        elWarn.style.display = 'block';
        elWarn.textContent = 'Notice: SharedArrayBuffer is not available in this browser context. Cross-origin isolation required for multi-threading.';
        return;
      }

      const colors = generateColors(bitDepth, space, fixed, shuffle, seedVal);

      // Shared Array Buffers
      const controlSab = new SharedArrayBuffer(64);
      const targetColorSab = new SharedArrayBuffer(16);
      const resultsDistSab = new SharedArrayBuffer(threadCount * 4);
      const resultsIdxSab = new SharedArrayBuffer(threadCount * 4);
      const gridSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const placedRSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const placedGSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const placedBSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const frontierSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const avgRSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const avgGSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      const avgBSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      sharedRgbaSab = new SharedArrayBuffer(totalCanvasPixels * 4);
      sharedRgbaView = new Uint8Array(sharedRgbaSab);
      const colorsSab = new SharedArrayBuffer(colors.length * 4);

      new Int32Array(gridSab).fill(-1);
      new Float32Array(colorsSab).set(colors);

      // Initialize compute workers
      const computeBlob = new Blob([computeWorkerSource], { type: 'application/javascript' });
      computeBlobUrl = URL.createObjectURL(computeBlob);

      for (let i = 0; i < threadCount; i++) {
        const worker = new Worker(computeBlobUrl);
        worker.postMessage({
          id: i,
          numWorkers: threadCount,
          width,
          height,
          strategy,
          controlSab,
          targetColorSab,
          resultsDistSab,
          resultsIdxSab,
          gridSab,
          placedRSab,
          placedGSab,
          placedBSab,
          frontierSab,
          avgRSab,
          avgGSab,
          avgBSab
        });
        computeWorkers.push(worker);
      }

      // Initialize coordinator worker
      const coordinatorBlob = new Blob([coordinatorWorkerSource], { type: 'application/javascript' });
      coordinatorBlobUrl = URL.createObjectURL(coordinatorBlob);
      coordinatorWorker = new Worker(coordinatorBlobUrl);

      coordinatorWorker.onmessage = function(e) {
        const msg = e.data;
        if (msg.cmd === 'tick') {
          // Blit to canvas
          localImageData.data.set(sharedRgbaView);
          ctx.putImageData(localImageData, 0, 0);

          // Update stats
          const now = performance.now();
          const elapsed = (now - lastStatsTime) / 1000;
          if (elapsed >= 0.25 || msg.finished) {
            const placedDiff = msg.placedCount - lastPlacedStats;
            const rate = elapsed > 0 ? Math.round(placedDiff / elapsed) : 0;
            elRate.textContent = msg.finished ? 'Complete' : `${rate.toLocaleString()} px/s`;
            lastStatsTime = now;
            lastPlacedStats = msg.placedCount;
          }

          elPlaced.textContent = `${msg.placedCount.toLocaleString()} / ${totalCanvasPixels.toLocaleString()}`;
          elFrontier.textContent = msg.frontierLen.toLocaleString();
          const pct = (msg.placedCount / totalCanvasPixels * 100).toFixed(1);
          elPct.textContent = `${pct}%`;

          if (msg.finished) {
            isRunning = false;
            btnToggle.textContent = 'Start';
          }
        }
      };

      coordinatorWorker.postMessage({
        cmd: 'init',
        width,
        height,
        startX,
        startY,
        strategy,
        numWorkers: threadCount,
        uncapped,
        batchSpeed,
        controlSab,
        targetColorSab,
        resultsDistSab,
        resultsIdxSab,
        gridSab,
        placedRSab,
        placedGSab,
        placedBSab,
        frontierSab,
        avgRSab,
        avgGSab,
        avgBSab,
        sharedRgbaSab,
        colorsSab
      });

      lastStatsTime = performance.now();
      lastPlacedStats = 1;
      elPlaced.textContent = `1 / ${totalCanvasPixels.toLocaleString()}`;
      elFrontier.textContent = '8';
      elPct.textContent = '0.0%';
      elRate.textContent = '0 px/s';
    }

    btnToggle.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        btnToggle.textContent = 'Pause';
        lastStatsTime = performance.now();
        lastPlacedStats = parseInt(elPlaced.textContent) || 0;
        if (coordinatorWorker) coordinatorWorker.postMessage({ cmd: 'start' });
      } else {
        btnToggle.textContent = 'Start';
        if (coordinatorWorker) coordinatorWorker.postMessage({ cmd: 'pause' });
      }
    });

    btnReset.addEventListener('click', reset);

    btnDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      const w = canvas.width, h = canvas.height;
      link.download = `color-shredder-${w}x${h}-strat${selStrategy.value}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    updateBadge();
    reset();
  </script>
</body>
</html>
